<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>오늘 나가?</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ═══════ 오늘 판정 ═══════ -->
<header id="verdict">
  <div class="vrow">
    <div class="vdate"><b id="vDate">—</b><span id="vLunar"></span></div>
    <div class="vnow" id="vNow">—</div>
  </div>
  <div class="vmain">
    <div class="vscore"><span id="vLabel">불러오는 중</span><i id="vDots"></i></div>
    <div class="vwhy" id="vWhy"></div>
  </div>
  <div class="vfacts" id="vFacts"></div>
  <button id="vRetry" class="ghost" hidden>다시 불러오기</button>
</header>

<!-- ═══════ 탭 ═══════ -->
<nav id="tabbar">
  <button data-tab="map" class="on">지도</button>
  <button data-tab="log">기록</button>
  <button data-tab="list">오름</button>
</nav>

<main>
  <!-- ─── 지도 ─── -->
  <section id="pane-map" class="pane on">
    <div id="map"></div>
    <div id="mapLegend">
      <span><i class="dot done"></i>다녀옴</span>
      <span><i class="dot todo"></i>안 감</span>
      <span><i class="dot food"></i>먹은곳</span>
      <button id="btnLocate" class="ghost sm">내 위치</button>
    </div>
    <div id="suggest"></div>
  </section>

  <!-- ─── 기록 ─── -->
  <section id="pane-log" class="pane">
    <div class="searchbar">
      <input id="q" type="search" placeholder="국수, ㄱㅅ, 오름 이름…" autocomplete="off" enterkeyhint="search">
      <button id="qClear" class="ghost sm" hidden>지움</button>
    </div>
    <div id="results"></div>
    <div id="logStats"></div>
    <div id="logList"></div>
  </section>

  <!-- ─── 오름 목록 ─── -->
  <section id="pane-list" class="pane">
    <div id="oreumStats"></div>
    <div id="oreumList"></div>
  </section>
</main>

<!-- ═══════ 다녀옴 버튼 ═══════ -->
<button id="fab">＋ 다녀옴</button>

<!-- ═══════ 기록 시트 ═══════ -->
<div id="sheet" class="sheet" hidden>
  <div class="sheetBack"></div>
  <div class="sheetBody">
    <div class="sheetHead">
      <b id="sheetTitle">다녀온 곳</b>
      <button id="sheetClose" class="ghost sm">닫기</button>
    </div>

    <div class="kinds" id="kindPick"></div>

    <input id="sName" type="text" placeholder="이름 (예: 고기국수집)" autocomplete="off">
    <div id="sHint" class="hint"></div>

    <label class="row">
      <span>날짜</span>
      <input id="sDate" type="date">
    </label>

    <div class="row">
      <span>위치</span>
      <span id="sGeo" class="mono">—</span>
      <button id="sGeoBtn" class="ghost sm">현재 위치</button>
    </div>

    <textarea id="sNote" rows="2" placeholder="메모 (없어도 됨)"></textarea>

    <div class="photoRow">
      <button id="sPhotoBtn" class="ghost">📷 사진</button>
      <img id="sPhoto" hidden alt="">
      <button id="sPhotoDel" class="ghost sm" hidden>사진 지움</button>
    </div>
    <input id="sPhotoFile" type="file" accept="image/*" hidden>

    <div class="sheetFoot">
      <button id="sDel" class="danger" hidden>삭제</button>
      <button id="sSave" class="primary">저장</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>
<div id="undo" hidden><span id="undoText"></span><button id="undoBtn">되돌리기</button></div>

<script src="vendor/leaflet.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
